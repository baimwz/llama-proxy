# LlamaProxy configuration.
# Copy to config.toml (same directory) and fill in real values.
# Values marked SECRET must never be committed to the repository.

[proxy]
listen_host = "0.0.0.0"
listen_port = 8080
master_api_key = "CHANGE-ME-long-random-string"   # SECRET: required by all clients
idle_timeout_s = 1200            # shutdown server after 20 min without requests
client_wait_timeout_s = 600      # max wait for non-streaming requests
sse_heartbeat_s = 15             # SSE keep-alive comment interval while booting

[llm]
# The LLM typically runs inside a Proxmox LXC container (e.g. LXC 100) -
# point this at the CONTAINER's address, not the bare host.
base_url = "http://llama-server.example:8080"     # LXC IP:port or Tailscale name
api_key = "CHANGE-ME"                              # SECRET: matches llama.cpp --api-key
model_name = "qwen3-27b"                           # reported on GET /v1/models
boot_timeout_s = 300                               # max wait for health after wake
health_interval_s = 2.0
read_timeout_s = 300                               # max gap between upstream chunks

[power]
# Power OFF the whole Proxmox host via SSH.
# user "root" -> remote command defaults to plain `poweroff`;
# any other user -> `sudo -n poweroff` (needs NOPASSWD for poweroff).
ssh_host = "proxmox.example"                       # LAN IP (WoL only works on the physical LAN)
ssh_user = "root"
ssh_key_path = "/home/pi/.ssh/id_ed25519_proxmox"  # SECRET: key file, not in repo
# ssh_command = "poweroff"                         # optional override of the remote command
# pre_shutdown_command = "pct stop 100"            # optional: run BEFORE poweroff
                                                    # (graceful LXC stop; failure does not abort)
# Power ON via Wake-on-LAN (sender must be in the same L2 as the server;
# Tailscale cannot carry WoL). Ports tried: 9, 7, 40, 4711.
wol_mac = "AA:BB:CC:DD:EE:FF"                      # STABLE: the server's LAN NIC MAC (see docs/deployment-v100.md)
# wol_bcast = "192.168.1.255"                      # VARIABLE: subnet broadcast; default 255.255.255.255
shutdown_verify_timeout_s = 30

[scheduler]
large_threshold_tokens = 4096   # "new" prompt tokens >= this -> Large job
small_max_concurrent = 2        # must be <= llama.cpp --parallel
large_exclusive = true          # Large job blocks ALL other jobs while running
classification = "delta"        # "delta" (new tokens only) or "total" (full prompt)
conv_state_ttl_s = 1800         # conversation cache state lifetime
conv_state_max = 128            # LRU cap for conversation states

[usage]
data_dir = "./data"             # only periodic usage flushes land here
flush_interval_s = 60

[users]
# Defaults for newly created user keys (llama-proxy keys add ... / POST /admin/keys).
# 0 = unlimited. Existing keys keep their own values.
default_priority = 3            # used when the request has no X-Priority header
default_max_priority = 10       # ceiling for the X-Priority header (0-10)
default_requests_per_hour = 0
default_tokens_per_day = 0

[tokenizer]
# Local token counting (downloaded once, cached in data_dir).
url = "https://huggingface.co/Qwen/Qwen3-27B/resolve/main/tokenizer.json"
# Set url = "" to force the conservative character heuristic.
