[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "llama-proxy"
version = "0.1.0"
description = "Raspberry-Pi proxy for a sleeping llama.cpp server: wake-on-request, priority queue, token-aware scheduling, monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.9",
  "httpx>=0.27",
  "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[project.scripts]
llama-proxy = "llama_proxy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
